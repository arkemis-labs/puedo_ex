name: Publish package to Hex 📦
on:
  push:
    tags:
      - "*@v*.*.*"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse git tag
        id: parse-tag
        run: |
          REF_NAME="${{ github.ref_name }}"
          PACKAGE_NAME="${REF_NAME%@*}"
          VERSION="${REF_NAME#*@}"
          PACKAGE_PATH="packages/${PACKAGE_NAME}"
          echo "package=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package_path=$PACKAGE_PATH" >> $GITHUB_OUTPUT
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "26.0"
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.parse-tag.outputs.package_path }}/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.parse-tag.outputs.package }}
      - name: Install root dependencies
        run: mix deps.get
      - name: Install project dependencies
        run: mix workspace.run -t deps.get -p ${{ steps.parse-tag.outputs.package }}
      - name: Compile project dependencies
        run: mix workspace.run -t deps.compile -p ${{ steps.parse-tag.outputs.package }}
      - name: Build project package
        run: mix workspace.run -t hex.build -p ${{ steps.parse-tag.outputs.package }}
      - name: Release & Publish project
        run: mix workspace.run -t hex.publish -p ${{ steps.parse-tag.outputs.package }} -- --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - name: Generate release notes
        id: release_notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header --include-path "${{ steps.parse-tag.outputs.package_path }}/**/*"
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.content }}
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --include-path "${{ steps.parse-tag.outputs.package_path }}/**/*"
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Commit
        run: |
          git checkout main
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "Update changelog"
          git push origin main
